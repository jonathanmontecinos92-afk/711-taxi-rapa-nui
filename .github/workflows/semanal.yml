name: Revisión semanal
# Velocidad y accesibilidad en móvil con Lighthouse.
on:
  schedule:
    - cron: "30 13 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lighthouse móvil
        run: npx --yes lighthouse "${{ vars.SITE_URL || 'https://711-taxi-rapa-nui.netlify.app' }}" --only-categories=performance,accessibility,best-practices --output=html --output=json --output-path=./informe --chrome-flags="--headless=new --no-sandbox"
      - uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: informe.*
